<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Particles - Koi Pond</title>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #051014; }
  canvas.pf-gl { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #hub { position: fixed; left: 10px; bottom: 10px; z-index: 10; color: #4d6a70;
    font: 11px/1.6 ui-monospace, Consolas, monospace; text-decoration: none; }
  #hub:hover { color: #9fb6bb; }
  #tip { position: fixed; right: 12px; bottom: 10px; z-index: 10; color: #33504f;
    font: 11px/1.6 ui-monospace, Consolas, monospace; pointer-events: none; }
  #fishctl { position: fixed; right: 12px; bottom: 30px; z-index: 10;
    color: #33504f; font: 11px/1.6 ui-monospace, Consolas, monospace;
    pointer-events: auto; user-select: none; }
  #fishctl button { background: none; border: 1px solid #33504f; color: #4d6a70;
    font: inherit; padding: 0 7px; margin: 0 4px; cursor: pointer; }
  #fishctl button:hover { color: #9fb6bb; border-color: #4d6a70; }
