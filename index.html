<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particles</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #080c14; }
  canvas.pf-gl { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: radial-gradient(ellipse 120% 90% at 50% 42%, transparent 55%, rgba(4, 7, 11, .55));
  }

  #menu {
    position: fixed; left: 50%; top: 64%; transform: translate(-50%, -50%);
    z-index: 5; width: min(360px, 86vw);
    display: flex; flex-direction: column; gap: 10px;
    font: 13px/1.5 ui-monospace, Consolas, monospace;
  }
  .card {
    display: block; padding: 12px 16px; text-decoration: none;
    color: #cfe0e3; background: rgba(8, 18, 24, .72); backdrop-filter: blur(6px);
    border: 1px solid rgba(120, 160, 170, .25); border-radius: 6px;
    transition: border-color .18s, background .18s, transform .18s;
    animation: rise .5s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  a.card:hover, .card.hi {
    border-color: rgba(120, 220, 170, .55); background: rgba(12, 30, 36, .82);
    transform: translateY(-1px);
  }
  a.card:focus-visible { outline: 1px solid rgba(120, 220, 170, .7); outline-offset: 2px; }
  .card .name { font-weight: 600; }
  .card .tag { float: right; font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: #3beb5e; margin-top: 2px; transition: color .18s; }
  a.card:hover .tag { color: #6cff8f; }
  .card .desc { color: #5f7a80; font-size: 11px; margin-top: 2px; transition: color .18s; }
  a.card:hover .desc { color: #8aa4aa; }
  .card.soon { opacity: .45; cursor: default; }
  .card.soon .tag { color: #5f7a80; }
  #credit {
    position: fixed; z-index: 5; margin: 0; text-align: right;
    font: 10px/1.5 ui-monospace, Consolas, monospace;
    letter-spacing: .12em; color: #54727a;
  }
  #credit a { color: #6d919b; text-decoration: none; }
  #credit a:hover { text-decoration: underline; }
  @media (max-height: 700px), (max-width: 480px) {
    #menu { gap: 6px; }
    .card { padding: 8px 14px; }
    .card .desc { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; transition: none; }
  }
</style>
</head>
<body>
<p id="credit">built with SWE-2 on <a href="https://devin.ai" target="_blank" rel="noopener">Devin</a><br>using pstack</p>
<nav id="menu" aria-label="creations"></nav>
<script type="module" src="src/pages/home.js"></script>
</body>
</html>
